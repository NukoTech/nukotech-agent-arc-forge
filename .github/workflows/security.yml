# Required pull-request and main-branch checks for this repository:
# gitleaks (pinned CLI), license-check, denylist, denylist-tests, author-email.
# Action and CLI SHAs: see ci/PINNED_SHAS.md (verified 2026-11-14 via gh api).

name: security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_ARCHIVE: gitleaks_8.30.1_linux_x64.tar.gz
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Check out full history for secret scan (clean workspace)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Install pinned gitleaks CLI and verify checksum
        run: |
          set -euo pipefail
          curl -sSL -o "/tmp/${GITLEAKS_ARCHIVE}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${GITLEAKS_ARCHIVE}"
          echo "${GITLEAKS_SHA256}  /tmp/${GITLEAKS_ARCHIVE}" | sha256sum -c -
          tar -C /tmp -xzf "/tmp/${GITLEAKS_ARCHIVE}" gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan the repository
        run: |
          set -euo pipefail
          config_args=()
          if [ -f .gitleaks.toml ]; then
            config_args+=(--config .gitleaks.toml)
          fi
          # v8.30.1 default is `git log -p -U0 --full-history --all --diff-filter=tuxdb`.
          # With fetch-depth: 0 that walks every fetched branch and turns unrelated
          # PRs red. --log-opts replaces the default; keep --full-history and the
          # default --diff-filter, but walk only the checked-out ref. On a
          # pull_request checkout that is the merge ref (main's history plus the
          # PR's commits).
          gitleaks detect --source . --no-banner --redact --verbose --exit-code 1 \
            --log-opts="--full-history --diff-filter=tuxdb HEAD" \
            "${config_args[@]}"

  license-check:
    name: license-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out this repository (clean workspace)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Guard against a stray top-level build/ directory
        run: |
          set -euo pipefail
          if [ -e build ]; then
            echo "Refusing to run: a top-level 'build' path is present and can shadow the PyPA 'build' package."
            ls -ld build
            exit 1
          fi

      - name: Require a root LICENSE file
        run: |
          set -euo pipefail
          test -f LICENSE
          # Flagship is planned MIT. Fail if the file is empty or still an internal-only marker.
          if grep -qiE 'LicenseRef-Nuko-Internal|ALL RIGHTS RESERVED|proprietary' LICENSE; then
            echo "LICENSE still looks internal or proprietary; relicense before a public GO."
            exit 1
          fi
          grep -qi 'MIT' LICENSE

      - name: Audit dependency licenses when a package is installable
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "pip-licenses==5.0.0"
          if [ -f pyproject.toml ] || [ -f setup.py ]; then
            python -m pip install --disable-pip-version-check -e .
            pip-licenses --format=markdown --from=mixed
            # Fail closed on copyleft / unknown. Adjust the allow list only with a review.
            pip-licenses --fail-on="GPL;GPLv2;GPLv3;AGPL;AGPL-3.0;LGPL;LGPL-3.0;SSPL;UNKNOWN"
          else
            echo "No pyproject.toml/setup.py in this checkout yet; LICENSE file check is the gate."
          fi

      # Enable as a required check only after REUSE.toml and SPDX headers exist.
      # Action SHA verified 2026-11-14: fsfe/reuse-action@v6.0.0
      # - name: REUSE lint
      #   uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  denylist:
    name: denylist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out this repository (clean workspace)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run denylist scan (must find 0 hits)
        env:
          DENYLIST_PATTERNS_B64: ${{ secrets.DENYLIST_PATTERNS_B64 }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          python ci/scripts/denylist_scan.py

  author-email:
    name: author-email
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history (clean workspace)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Reject banned commit author or committer emails
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          ARCFORGE_AUTHOR_EMAIL_HMAC: ${{ secrets.ARCFORGE_AUTHOR_EMAIL_HMAC }}
        run: |
          set -euo pipefail
          python ci/scripts/author_email_check.py

  denylist-tests:
    name: denylist-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out this repository (clean workspace)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Guard against a stray top-level build/ directory
        run: |
          set -euo pipefail
          if [ -e build ]; then
            echo "Refusing to run: a top-level 'build' path is present and can shadow the PyPA 'build' package."
            ls -ld build
            exit 1
          fi

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check "pytest==8.4.2"

      - name: Run denylist scanner unit tests (synthetic patterns only)
        run: |
          set -euo pipefail
          python -m pytest -q --tb=short ci/tests
