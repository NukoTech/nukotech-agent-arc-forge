[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nukotech-agent-arc"
version = "0.3.0a1"
description = "Deterministic non-runtime agent architecture composer"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.2,<7",
  "jsonschema>=4.25.1,<5"
]

[project.scripts]
agent-arc = "nukotech_agent_arc.cli:main"

[project.optional-dependencies]
test = [
  "pytest==8.4.2",
  "setuptools==84.2.1",
  "wheel==0.48.0",
]
signing = ["cryptography==50.0.2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nukotech_agent_arc = ["schemas/*.json"]
